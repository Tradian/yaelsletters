<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024">
  <!-- Large tonal mottle: very low-frequency clouds, blurred smooth, so the
       parchment's tone drifts gently instead of blotching. -->
  <filter id="mottle" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0045" numOctaves="4" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feGaussianBlur stdDeviation="2.5"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#mottle)" opacity="0.32"/>
</svg>
