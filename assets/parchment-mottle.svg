<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640">
  <!-- Large tonal mottle: low-frequency clouds give parchment its uneven,
       aged tone. Gamma on alpha deepens the patches so they read as age. -->
  <filter id="mottle">
    <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="3" seed="11" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="gamma" amplitude="1" exponent="1.7" offset="0"/>
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#mottle)" opacity="0.5"/>
</svg>
