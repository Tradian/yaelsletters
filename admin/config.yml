# Sveltia CMS — Yael's letter editor.
# Commits markdown to content/letters/; the deploy rebuilds the site.

backend:
  name: github
  repo: Tradian/yaelsletters
  branch: main
  # base_url: https://<your-oauth-worker>   # ← set after the one-time login setup (see SETUP-LOGIN.md)

site_url: https://tradian.github.io/yaelsletters
display_url: https://tradian.github.io/yaelsletters
logo_url: https://tradian.github.io/yaelsletters/assets/goat.jpg

# Where pictures dropped into a letter are stored
media_folder: assets/uploads
public_folder: assets/uploads

# So she can preview a draft before publishing
publish_mode: editorial_workflow

collections:
  # ── Settings ───────────────────────────────────────────────────────────────
  - name: settings
    label: Settings
    label_singular: Setting
    description: "Little site-wide switches."
    editor:
      preview: false
    files:
      - name: site
        label: "Site settings"
        file: content/settings.json
        fields:
          - name: entrySound
            label: "Soft goat sound when someone enters"
            widget: boolean
            default: true
            hint: "A gentle bleat the first time a visitor taps or clicks on the home page. Turn off for silence."

  # ── Series ───────────────────────────────────────────────────────────────
  - name: series
    label: Series
    label_singular: Series
    description: "A multi-part series. Create one here, then assign letters to it on the Letters tab."
    folder: content/series
    create: true
    delete: true
    identifier_field: title
    slug: "{{fields.slug}}"
    summary: "{{title}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: "Series name", widget: string }
      - { name: slug, label: "Web address", widget: string, hint: "Short, lowercase, dashes — e.g. the-ancient-path" }
      - { name: description, label: "What the series is about", widget: text }
      - { name: seal, label: "Wax-seal letter", widget: string, default: "S", required: false }
      - { name: order, label: "Sort order", widget: number, value_type: int, default: 0, required: false, hint: "Lower numbers sit higher on the page." }

  # ── Letters ──────────────────────────────────────────────────────────────
  - name: letters
    label: Letters
    label_singular: Letter
    description: "Write a new letter, or edit an old one. Choose a series or leave it standalone. Tap Publish when ready."
    folder: content/letters
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug}}"
    summary: "{{title}}  ·  {{date}}"
    sortable_fields: [date, title]
    view_filters:
      - { label: "Drafts", field: draft, pattern: true }
      - { label: "Published", field: draft, pattern: false }
    fields:
      - { name: title, label: "Title", widget: string, hint: "The letter's headline." }
      - { name: date, label: "Date", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: slug, label: "Web address", widget: string, hint: "Short, lowercase, dashes — e.g. blame-paul" }
      - { name: excerpt, label: "Teaser", widget: text, hint: "One or two sentences shown on the envelope and in the email." }
      - { name: body, label: "Letter", widget: markdown, hint: "Write freely. This is the letter itself." }
      - name: series
        label: "Part of a series?"
        widget: relation
        required: false
        collection: series
        value_field: slug
        search_fields: [title]
        display_fields: [title]
        hint: "Leave blank for a standalone letter."
      - { name: part, label: "Part number (within the series)", widget: number, value_type: int, required: false, hint: "1, 2, 3… Only needed if it's in a series." }
      - { name: email_send, label: "Send to subscribers when published", widget: boolean, default: false, hint: "Tick this when the letter is ready to email. Leave off for site-only, or while you're still editing." }
      - { name: seal, label: "Wax-seal letter", widget: string, default: "Y", required: false }
      - { name: draft, label: "Save as draft (don't publish yet)", widget: boolean, default: false }
      - { name: title_html, label: "Fancy title (optional)", widget: string, required: false, hint: "Advanced — leave blank unless you want custom line breaks/italics in the headline." }
