# Sveltia CMS — Yael's letter editor.
# Commits markdown to content/letters/; the deploy rebuilds the site.

backend:
  name: github
  repo: Tradian/yaelsletters
  branch: main
  # base_url: https://<your-oauth-worker>   # ← set after the one-time login setup (see SETUP-LOGIN.md)

site_url: https://yaelsletters.com
display_url: https://yaelsletters.com
logo_url: https://yaelsletters.com/assets/goat.jpg

# Where pictures dropped into a letter are stored
media_folder: assets/uploads
public_folder: assets/uploads

# So she can preview a draft before publishing
publish_mode: editorial_workflow

collections:
  # ── Books ──────────────────────────────────────────────────────────────────
  - name: books
    label: Books
    label_singular: Book
    description: "Your books. Add one when it's ready — cover art is placed for you; paste the Amazon / free-PDF links and the buttons go live."
    folder: content/books
    create: true
    delete: true
    identifier_field: title
    slug: "{{fields.slug}}"
    summary: "{{title}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: "Title", widget: string, hint: "e.g. Counting of the Omer 2026" }
      - { name: slug, label: "Web address", widget: string, hint: "Short, lowercase, dashes — e.g. counting-of-the-omer-2026" }
      - { name: kicker, label: "Small line above the title on the cover", widget: string, required: false, hint: "e.g. A Daily Devotional · 2026" }
      - { name: status, label: "Status line", widget: string, default: "Out now", required: false }
      - { name: author, label: "Author", widget: string, default: "Yael", required: false }
      - { name: cover_title, label: "Title as it wraps on the little cover", widget: text, required: false, hint: "Press Enter where the line should break." }
      - { name: spine_title, label: "Title on the spine", widget: string, required: false }
      - { name: shelf_note, label: "Note under the book on the shelf", widget: string, required: false, hint: "e.g. Free PDF · or in print" }
      - { name: blurb, label: "One-paragraph blurb", widget: text }
      - { name: amazon, label: "Amazon link (print)", widget: string, required: false, hint: "Paste it and the button goes live; leave blank for a quiet 'soon'." }
      - { name: pdf, label: "Free PDF link", widget: string, required: false }
      - { name: free_note, label: "Free-to-read note", widget: string, required: false, default: "Free to read, always — the Word was never meant to sit behind a paywall." }
      - { name: closing, label: "Closing line", widget: string, required: false }
      - { name: body, label: "About this book", widget: markdown, hint: "A couple of paragraphs for the book's page." }
      - { name: published, label: "Show on the site", widget: boolean, default: true }
      - { name: order, label: "Shelf order", widget: number, value_type: int, default: 1, required: false }

  # ── Pages ──────────────────────────────────────────────────────────────────
  - name: pages
    label: Pages
    description: "The words on the About, Support, and Books pages."
    editor:
      preview: false
    files:
      - name: about
        label: "About page"
        file: content/pages/about.md
        fields:
          - { name: kicker, label: "Small line up top", widget: string }
          - { name: title_html, label: "Page title", widget: string, hint: "Advanced: <em>…</em> makes a word italic." }
          - { name: lede, label: "Intro line", widget: text }
          - { name: caption, label: "Caption under the goat", widget: string }
          - { name: body, label: "The letter itself", widget: markdown }
          - { name: subscribe_title, label: "Subscribe box title", widget: string }
          - { name: subscribe_note, label: "Subscribe box note", widget: string }
      - name: support
        label: "Support page"
        file: content/pages/support.md
        fields:
          - { name: kicker, label: "Small line up top", widget: string }
          - { name: title_html, label: "Page title", widget: string, hint: "Advanced: <em>…</em> makes a word italic." }
          - { name: body, label: "Your note to readers", widget: markdown }
          - { name: kofi, label: "Ko-fi link", widget: string, required: false, hint: "e.g. https://ko-fi.com/yaelsletters — blank hides it politely." }
          - { name: stripe, label: "'Give another way' link", widget: string, required: false }
          - { name: ways, label: "Other ways to help (list)", widget: list, required: false }
          - { name: subscribe_title, label: "Subscribe box title", widget: string }
          - { name: subscribe_note, label: "Subscribe box note", widget: string }
      - name: books
        label: "Books page (the shelf)"
        file: content/pages/books.md
        fields:
          - { name: kicker, label: "Small line up top", widget: string }
          - { name: title_html, label: "Page title", widget: string, hint: "Advanced: <em>…</em> makes a word italic." }
          - { name: lede, label: "Intro line", widget: text }
          - { name: show_coming_soon, label: "Show a 'coming soon' book on the shelf", widget: boolean, default: true }
          - { name: coming_caption, label: "Coming-soon caption", widget: string, required: false }
          - { name: coming_note, label: "Coming-soon small note", widget: string, required: false }
          - { name: subscribe_title, label: "Subscribe box title", widget: string }
          - { name: subscribe_note, label: "Subscribe box note", widget: string }
          - { name: body, label: "(unused)", widget: hidden, required: false, default: "" }

  # ── Settings ───────────────────────────────────────────────────────────────
  - name: settings
    label: Settings
    label_singular: Setting
    description: "Little site-wide switches."
    editor:
      preview: false
    files:
      - name: site
        label: "Site settings"
        file: content/settings.json
        fields:
          - name: entrySound
            label: "Soft goat sound when someone enters"
            widget: boolean
            default: true
            hint: "A gentle bleat the first time a visitor taps or clicks on the home page. Turn off for silence."

  # ── Series ───────────────────────────────────────────────────────────────
  - name: series
    label: Series
    label_singular: Series
    description: "A multi-part series. Create one here, then assign letters to it on the Letters tab."
    folder: content/series
    create: true
    delete: true
    identifier_field: title
    slug: "{{fields.slug}}"
    summary: "{{title}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: "Series name", widget: string }
      - { name: slug, label: "Web address", widget: string, hint: "Short, lowercase, dashes — e.g. the-ancient-path" }
      - { name: description, label: "What the series is about", widget: text }
      - { name: seal, label: "Wax-seal letter", widget: string, default: "S", required: false }
      - { name: order, label: "Sort order", widget: number, value_type: int, default: 0, required: false, hint: "Lower numbers sit higher on the page." }

  # ── Letters ──────────────────────────────────────────────────────────────
  - name: letters
    label: Letters
    label_singular: Letter
    description: "Write a new letter, or edit an old one. Choose a series or leave it standalone. Tap Publish when ready."
    folder: content/letters
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug}}"
    summary: "{{title}}  ·  {{date}}"
    sortable_fields: [date, title]
    view_filters:
      - { label: "Drafts", field: draft, pattern: true }
      - { label: "Published", field: draft, pattern: false }
    fields:
      - { name: title, label: "Title", widget: string, hint: "The letter's headline." }
      - { name: date, label: "Date", widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { name: slug, label: "Web address", widget: string, hint: "Short, lowercase, dashes — e.g. blame-paul" }
      - { name: excerpt, label: "Teaser", widget: text, hint: "One or two sentences shown on the envelope and in the email." }
      - { name: body, label: "Letter", widget: markdown, hint: "Write freely. This is the letter itself." }
      - name: series
        label: "Part of a series?"
        widget: relation
        required: false
        collection: series
        value_field: slug
        search_fields: [title]
        display_fields: [title]
        hint: "Leave blank for a standalone letter."
      - { name: part, label: "Part number (within the series)", widget: number, value_type: int, required: false, hint: "1, 2, 3… Only needed if it's in a series." }
      - { name: email_send, label: "Send to subscribers when published", widget: boolean, default: false, hint: "Tick this when the letter is ready to email. Leave off for site-only, or while you're still editing." }
      - { name: seal, label: "Wax-seal letter", widget: string, default: "Y", required: false }
      - { name: draft, label: "Save as draft (don't publish yet)", widget: boolean, default: false }
      - { name: title_html, label: "Fancy title (optional)", widget: string, required: false, hint: "Advanced — leave blank unless you want custom line breaks/italics in the headline." }
