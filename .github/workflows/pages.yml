name: Preview — deploy to GitHub Pages

# Publishes the static site as a clickable preview. Runs on every push to the
# working branch, and can be triggered by hand from the Actions tab.
on:
  push:
    branches: ["claude/gifted-keller-lbwTO"]
  workflow_dispatch:

# Permissions the deploy-pages action needs
permissions:
  contents: read
  pages: write
  id-token: write

# Only one live deployment at a time; newer pushes supersede older runs.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # the site lives at the repo root (index.html, styles.css, assets/)
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
