name: Deploy to GitHub Pages

# Publishes the live site. Deploys on push to main (the live branch) only.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permissions the deploy-pages action needs
permissions:
  contents: read
  pages: write
  id-token: write

# Only one live deployment at a time; newer pushes supersede older runs.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # create/enable the Pages site automatically (no manual toggle)
          enablement: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm ci

      - name: Build letters & feed
        run: npm run build

      - name: Send new letters to subscribers (Resend)
        if: ${{ env.RESEND_API_KEY != '' }}
        run: node build/send-email.mjs

      # The artifact is the public site — strip everything that isn't a page
      # a reader should reach: dev deps, build tooling, content sources, and
      # internal docs/handoff notes. SECURITY.md stays (it names the contact
      # for reporting issues).
      - name: Keep only the public site
        run: >
          rm -rf node_modules .github build workers content handoff
          README.md SETUP-LOGIN.md STORE.md package.json package-lock.json
          .gitignore assets/goat-prompt.md assets/covers/README.md

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # the site lives at the repo root (index.html, styles.css, assets/)
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
